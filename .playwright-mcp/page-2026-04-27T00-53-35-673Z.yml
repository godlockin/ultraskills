                  - listitem [ref=e1080]:
                    - text: The
                    - code [ref=e1081]: jieba.cut
                    - text: "function accepts three input parameters: the first parameter is the string to be cut; the second parameter is"
                    - code [ref=e1082]: cut_all
                    - text: ", controlling the cut mode; the third parameter is to control whether to use the Hidden Markov Model."
                  - listitem [ref=e1083]:
                    - code [ref=e1084]: jieba.cut_for_search
                    - text: "accepts two parameter: the string to be cut; whether to use the Hidden Markov Model. This will cut the sentence into short words suitable for search engines."
                  - listitem [ref=e1085]: The input string can be an unicode/str object, or a str/bytes object which is encoded in UTF-8 or GBK. Note that using GBK encoding is not recommended because it may be unexpectly decoded as UTF-8.
                  - listitem [ref=e1086]:
                    - code [ref=e1087]: jieba.cut
