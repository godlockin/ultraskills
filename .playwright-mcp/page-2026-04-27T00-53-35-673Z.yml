                - list [ref=e1067]:
                  - listitem [ref=e1068]: Based on a prefix dictionary structure to achieve efficient word graph scanning. Build a directed acyclic graph (DAG) for all possible word combinations.
                  - listitem [ref=e1069]: Use dynamic programming to find the most probable combination based on the word frequency.
