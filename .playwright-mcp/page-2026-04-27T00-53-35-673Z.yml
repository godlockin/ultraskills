                - generic [ref=e365]:
                  - heading "jieba" [level=1] [ref=e366]
                  - 'link "Permalink: jieba" [ref=e367] [cursor=pointer]':
                    - /url: "#jieba"
                    - img [ref=e368]
                - paragraph [ref=e370]: “结巴”中文分词：做最好的 Python 中文分词组件
                - paragraph [ref=e371]: "\"Jieba\" (Chinese for \"to stutter\") Chinese text segmentation: built to be the best Python Chinese word segmentation module."
                - list [ref=e372]:
                  - listitem [ref=e373]:
                    - emphasis [ref=e374]: Scroll down for English documentation.
                - generic [ref=e375]:
                  - heading "特点" [level=1] [ref=e376]
                  - 'link "Permalink: 特点" [ref=e377] [cursor=pointer]':
                    - /url: "#特点"
                    - img [ref=e378]
                - list [ref=e380]:
                  - listitem [ref=e381]:
                    - text: 支持四种分词模式：
                    - list [ref=e382]:
                      - listitem [ref=e383]: 精确模式，试图将句子最精确地切开，适合文本分析；
                      - listitem [ref=e384]: 全模式，把句子中所有的可以成词的词语都扫描出来, 速度非常快，但是不能解决歧义；
                      - listitem [ref=e385]: 搜索引擎模式，在精确模式的基础上，对长词再次切分，提高召回率，适合用于搜索引擎分词。
                      - listitem [ref=e386]:
                        - text: paddle模式，利用PaddlePaddle深度学习框架，训练序列标注（双向GRU）网络模型实现分词。同时支持词性标注。paddle模式使用需安装paddlepaddle-tiny，
                        - code [ref=e387]: pip install paddlepaddle-tiny==1.6.1
                        - text: 。目前paddle模式支持jieba v0.40及以上版本。jieba v0.40以下版本，请升级jieba，
                        - code [ref=e388]: pip install jieba --upgrade
                        - text: 。
                        - link "PaddlePaddle官网" [ref=e389] [cursor=pointer]:
                          - /url: https://www.paddlepaddle.org.cn/
                  - listitem [ref=e390]: 支持繁体分词
                  - listitem [ref=e391]: 支持自定义词典
                  - listitem [ref=e392]: MIT 授权协议
                - generic [ref=e393]:
                  - heading "安装说明" [level=1] [ref=e394]
                  - 'link "Permalink: 安装说明" [ref=e395] [cursor=pointer]':
                    - /url: "#安装说明"
                    - img [ref=e396]
                - paragraph [ref=e398]: 代码对 Python 2/3 均兼容
                - list [ref=e399]:
                  - listitem [ref=e400]:
                    - text: 全自动安装：
                    - code [ref=e401]: easy_install jieba
                    - text: 或者
                    - code [ref=e402]: pip install jieba
                    - text: /
                    - code [ref=e403]: pip3 install jieba
                  - listitem [ref=e404]:
                    - text: 半自动安装：先下载
                    - link "http://pypi.python.org/pypi/jieba/" [ref=e405] [cursor=pointer]:
                      - /url: http://pypi.python.org/pypi/jieba/
                    - text: ，解压后运行
                    - code [ref=e406]: python setup.py install
                  - listitem [ref=e407]: 手动安装：将 jieba 目录放置于当前目录或者 site-packages 目录
                  - listitem [ref=e408]:
                    - text: 通过
                    - code [ref=e409]: import jieba
                    - text: 来引用
                  - listitem [ref=e410]:
                    - text: 如果需要使用paddle模式下的分词和词性标注功能，请先安装paddlepaddle-tiny，
                    - code [ref=e411]: pip install paddlepaddle-tiny==1.6.1
                    - text: 。
                - generic [ref=e412]:
                  - heading "算法" [level=1] [ref=e413]
                  - 'link "Permalink: 算法" [ref=e414] [cursor=pointer]':
                    - /url: "#算法"
                    - img [ref=e415]
                - list [ref=e417]:
                  - listitem [ref=e418]: 基于前缀词典实现高效的词图扫描，生成句子中汉字所有可能成词情况所构成的有向无环图 (DAG)
                  - listitem [ref=e419]: 采用了动态规划查找最大概率路径, 找出基于词频的最大切分组合
                  - listitem [ref=e420]: 对于未登录词，采用了基于汉字成词能力的 HMM 模型，使用了 Viterbi 算法
                - generic [ref=e421]:
                  - heading "主要功能" [level=1] [ref=e422]
                  - 'link "Permalink: 主要功能" [ref=e423] [cursor=pointer]':
                    - /url: "#主要功能"
                    - img [ref=e424]
                - list [ref=e426]:
                  - listitem [ref=e427]: 分词
                - separator [ref=e428]
                - list [ref=e429]:
                  - listitem [ref=e430]:
                    - code [ref=e431]: jieba.cut
                    - text: "方法接受四个输入参数: 需要分词的字符串；cut_all 参数用来控制是否采用全模式；HMM 参数用来控制是否使用 HMM 模型；use_paddle 参数用来控制是否使用paddle模式下的分词模式，paddle模式采用延迟加载方式，通过enable_paddle接口安装paddlepaddle-tiny，并且import相关代码；"
                  - listitem [ref=e432]:
                    - code [ref=e433]: jieba.cut_for_search
                    - text: 方法接受两个参数：需要分词的字符串；是否使用 HMM 模型。该方法适合用于搜索引擎构建倒排索引的分词，粒度比较细
                  - listitem [ref=e434]: 待分词的字符串可以是 unicode 或 UTF-8 字符串、GBK 字符串。注意：不建议直接输入 GBK 字符串，可能无法预料地错误解码成 UTF-8
                  - listitem [ref=e435]:
                    - code [ref=e436]: jieba.cut
                    - text: 以及
                    - code [ref=e437]: jieba.cut_for_search
                    - text: 返回的结构都是一个可迭代的 generator，可以使用 for 循环来获得分词后得到的每一个词语(unicode)，或者用
                  - listitem [ref=e438]:
                    - code [ref=e439]: jieba.lcut
                    - text: 以及
                    - code [ref=e440]: jieba.lcut_for_search
                    - text: 直接返回 list
                  - listitem [ref=e441]:
                    - code [ref=e442]: jieba.Tokenizer(dictionary=DEFAULT_DICT)
                    - text: 新建自定义分词器，可用于同时使用不同词典。
                    - code [ref=e443]: jieba.dt
                    - text: 为默认分词器，所有全局分词相关函数都是该分词器的映射。
                - paragraph [ref=e444]: 代码示例
                - generic [ref=e445]:
                  - generic [ref=e446]: "# encoding=utf-8 import jieba jieba.enable_paddle()# 启动paddle模式。 0.40版之后开始支持，早期版本不支持 strs=[\"我来到北京清华大学\",\"乒乓球拍卖完了\",\"中国科学技术大学\"] for str in strs: seg_list = jieba.cut(str,use_paddle=True) # 使用paddle模式 print(\"Paddle Mode: \" + '/'.join(list(seg_list))) seg_list = jieba.cut(\"我来到北京清华大学\", cut_all=True) print(\"Full Mode: \" + \"/ \".join(seg_list)) # 全模式 seg_list = jieba.cut(\"我来到北京清华大学\", cut_all=False) print(\"Default Mode: \" + \"/ \".join(seg_list)) # 精确模式 seg_list = jieba.cut(\"他来到了网易杭研大厦\") # 默认是精确模式 print(\", \".join(seg_list)) seg_list = jieba.cut_for_search(\"小明硕士毕业于中国科学院计算所，后在日本京都大学深造\") # 搜索引擎模式 print(\", \".join(seg_list))"
                  - button "Copy" [ref=e448] [cursor=pointer]:
                    - img [ref=e449]
                - paragraph [ref=e452]: "输出:"
                - generic [ref=e453]:
                  - code [ref=e455]: "【全模式】: 我/ 来到/ 北京/ 清华/ 清华大学/ 华大/ 大学 【精确模式】: 我/ 来到/ 北京/ 清华大学 【新词识别】：他, 来到, 了, 网易, 杭研, 大厦 (此处，“杭研”并没有在词典中，但是也被Viterbi算法识别出来了) 【搜索引擎模式】： 小明, 硕士, 毕业, 于, 中国, 科学, 学院, 科学院, 中国科学院, 计算, 计算所, 后, 在, 日本, 京都, 大学, 日本京都大学, 深造"
                  - button "Copy" [ref=e457] [cursor=pointer]:
                    - img [ref=e458]
                - list [ref=e461]:
                  - listitem [ref=e462]: 添加自定义词典
                - separator [ref=e463]
                - generic [ref=e464]:
                  - heading "载入词典" [level=3] [ref=e465]
                  - 'link "Permalink: 载入词典" [ref=e466] [cursor=pointer]':
                    - /url: "#载入词典"
                    - img [ref=e467]
                - list [ref=e469]:
                  - listitem [ref=e470]: 开发者可以指定自己自定义的词典，以便包含 jieba 词库里没有的词。虽然 jieba 有新词识别能力，但是自行添加新词可以保证更高的正确率
                  - listitem [ref=e471]: "用法： jieba.load_userdict(file_name) # file_name 为文件类对象或自定义词典的路径"
                  - listitem [ref=e472]:
                    - text: 词典格式和
                    - code [ref=e473]: dict.txt
                    - text: 一样，一个词占一行；每一行分三部分：词语、词频（可省略）、词性（可省略），用空格隔开，顺序不可颠倒。
                    - code [ref=e474]: file_name
                    - text: 若为路径或二进制方式打开的文件，则文件必须为 UTF-8 编码。
                  - listitem [ref=e475]: 词频省略时使用自动计算的能保证分出该词的词频。
                - paragraph [ref=e476]:
                  - strong [ref=e477]: 例如：
                - generic [ref=e478]:
                  - code [ref=e480]: 创新办 3 i 云计算 5 凱特琳 nz 台中
                  - button "Copy" [ref=e482] [cursor=pointer]:
                    - img [ref=e483]
                - list [ref=e486]:
                  - listitem [ref=e487]:
                    - paragraph [ref=e488]:
                      - text: 更改分词器（默认为
                      - code [ref=e489]: jieba.dt
                      - text: ）的
                      - code [ref=e490]: tmp_dir
