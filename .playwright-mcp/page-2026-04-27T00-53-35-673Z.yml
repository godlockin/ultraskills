                    - img [ref=e1120]
                - list [ref=e1122]:
                  - listitem [ref=e1123]: Developers can specify their own custom dictionary to be included in the jieba default dictionary. Jieba is able to identify new words, but you can add your own new words can ensure a higher accuracy.
                  - listitem [ref=e1124]:
                    - text: Usage：
                    - code [ref=e1125]: jieba.load_userdict(file_name)
                    - text: "# file_name is a file-like object or the path of the custom dictionary"
                  - listitem [ref=e1126]:
                    - text: The dictionary format is the same as that of
                    - code [ref=e1127]: dict.txt
                    - text: ": one word per line; each line is divided into three parts separated by a space: word, word frequency, POS tag. If"
                    - code [ref=e1128]: file_name
                    - text: is a path or a file opened in binary mode, the dictionary must be UTF-8 encoded.
                  - listitem [ref=e1129]: The word frequency and POS tag can be omitted respectively. The word frequency will be filled with a suitable value if omitted.
                - paragraph [ref=e1130]:
                  - strong [ref=e1131]: "For example:"
                - generic [ref=e1132]:
                  - code [ref=e1134]: 创新办 3 i 云计算 5 凱特琳 nz 台中
