                    - text: returns a list.
                  - listitem [ref=e1093]:
                    - code [ref=e1094]: jieba.Tokenizer(dictionary=DEFAULT_DICT)
                    - text: creates a new customized Tokenizer, which enables you to use different dictionaries at the same time.
