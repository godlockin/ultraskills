                    - /url: "#setup"
                    - img [ref=e563]
                - paragraph [ref=e565]:
                  - text: We used Python 3.9.9 and
                  - link "PyTorch" [ref=e566] [cursor=pointer]:
                    - /url: https://pytorch.org/
                  - text: 1.10.1 to train and test our models, but the codebase is expected to be compatible with Python 3.8-3.11 and recent PyTorch versions. The codebase also depends on a few Python packages, most notably
                  - link "OpenAI's tiktoken" [ref=e567] [cursor=pointer]:
                    - /url: https://github.com/openai/tiktoken
                  - text: "for their fast tokenizer implementation. You can download and install (or update to) the latest release of Whisper with the following command:"
                - generic [ref=e568]:
                  - code [ref=e570]: pip install -U openai-whisper
                  - button "Copy" [ref=e572] [cursor=pointer]:
                    - img [ref=e573]
