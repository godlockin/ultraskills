                - paragraph [ref=e700]: "We start by extracting topics from the well-known 20 newsgroups dataset containing English documents:"
                - generic [ref=e701]:
                  - generic [ref=e702]: from bertopic import BERTopic from sklearn.datasets import fetch_20newsgroups docs = fetch_20newsgroups(subset='all', remove=('headers', 'footers', 'quotes'))['data'] topic_model = BERTopic() topics, probs = topic_model.fit_transform(docs)
                  - button "Copy" [ref=e704] [cursor=pointer]:
                    - img [ref=e705]
                - paragraph [ref=e708]: "After generating topics and their probabilities, we can access all of the topics together with their topic representations:"
                - generic [ref=e709]:
                  - generic [ref=e710]: ">>> topic_model.get_topic_info() Topic Count Name -1 4630 -1_can_your_will_any 0 693 49_windows_drive_dos_file 1 466 32_jesus_bible_christian_faith 2 441 2_space_launch_orbit_lunar 3 381 22_key_encryption_keys_encrypted ..."
                  - button "Copy" [ref=e712] [cursor=pointer]:
                    - img [ref=e713]
                - paragraph [ref=e716]:
                  - text: The
                  - code [ref=e717]: "-1"
                  - text: "topic refers to all outlier documents and are typically ignored. Each word in a topic describes the underlying theme of that topic and can be used for interpreting that topic. Next, let's take a look at the most frequent topic that was generated:"
                - generic [ref=e718]:
                  - generic [ref=e719]: ">>> topic_model.get_topic(0) [('windows', 0.006152228076250982), ('drive', 0.004982897610645755), ('dos', 0.004845038866360651), ('file', 0.004140142872194834), ('disk', 0.004131678774810884), ('mac', 0.003624848635985097), ('memory', 0.0034840976976789903), ('software', 0.0034415334250699077), ('email', 0.0034239554442333257), ('pc', 0.003047105930670237)]"
                  - button "Copy" [ref=e721] [cursor=pointer]:
                    - img [ref=e722]
                - paragraph [ref=e725]:
                  - text: Using
                  - code [ref=e726]: .get_document_info
                  - text: ", we can also extract information on a document level, such as their corresponding topics, probabilities, whether they are representative documents for a topic, etc.:"
                - generic [ref=e727]:
                  - generic [ref=e728]: ">>> topic_model.get_document_info(docs) Document Topic Name Top_n_words Probability ... I am sure some bashers of Pens... 0 0_game_team_games_season game - team - games... 0.200010 ... My brother is in the market for... -1 -1_can_your_will_any can - your - will... 0.420668 ... Finally you said what you dream... -1 -1_can_your_will_any can - your - will... 0.807259 ... Think! It's the SCSI card doing... 49 49_windows_drive_dos_file windows - drive - docs... 0.071746 ... 1) I have an old Jasmine drive... 49 49_windows_drive_dos_file windows - drive - docs... 0.038983 ..."
                  - button "Copy" [ref=e730] [cursor=pointer]:
                    - img [ref=e731]
