                  - text: to select a model that supports 50+ languages.
                - generic [ref=e738]:
                  - heading "Fine-tune Topic Representations" [level=2] [ref=e739]
                  - 'link "Permalink: Fine-tune Topic Representations" [ref=e740] [cursor=pointer]':
