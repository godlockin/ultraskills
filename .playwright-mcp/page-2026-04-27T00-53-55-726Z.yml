                - paragraph [ref=e743]:
                  - text: In BERTopic, there are a number of different
                  - link "topic representations" [ref=e744] [cursor=pointer]:
                    - /url: https://maartengr.github.io/BERTopic/getting_started/representation/representation.html
                  - text: that we can choose from. They are all quite different from one another and give interesting perspectives and variations of topic representations. A great start is
                  - code [ref=e745]: KeyBERTInspired
                  - text: ", which for many users increases the coherence and reduces stopwords from the resulting topic representations:"
                - generic [ref=e746]:
                  - generic [ref=e747]: "from bertopic.representation import KeyBERTInspired # Fine-tune your topic representations representation_model = KeyBERTInspired() topic_model = BERTopic(representation_model=representation_model)"
                  - button "Copy" [ref=e749] [cursor=pointer]:
                    - img [ref=e750]
