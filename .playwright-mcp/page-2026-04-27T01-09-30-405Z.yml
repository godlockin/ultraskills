                - paragraph [ref=e608]:
                  - strong [ref=e609]: Quick Start (Python API)
                  - text: ":"
                - paragraph [ref=e610]: "To get started, there is a high level function in the library that performs content-aware scene detection on a video (try it from a Python prompt):"
                - generic [ref=e611]:
                  - generic [ref=e612]: from scenedetect import detect, ContentDetector scene_list = detect('my_video.mp4', ContentDetector())
                  - button "Copy" [ref=e614] [cursor=pointer]:
                    - img [ref=e615]
                - paragraph [ref=e618]:
                  - code [ref=e619]: scene_list
                  - text: will now be a list containing the start/end times of all scenes found in the video. There also exists a two-pass version
                  - code [ref=e620]: AdaptiveDetector
                  - text: which handles fast camera movement better, and
                  - code [ref=e621]: ThresholdDetector
                  - text: for handling fade out/fade in events.
                - paragraph [ref=e622]:
                  - text: Try calling
                  - code [ref=e623]: print(scene_list)
                  - text: ", or iterating over each scene:"
                - generic [ref=e624]:
                  - generic [ref=e625]: "from scenedetect import detect, ContentDetector scene_list = detect('my_video.mp4', ContentDetector()) for i, scene in enumerate(scene_list): print(' Scene %2d: Start %s / Frame %d, End %s / Frame %d' % ( i+1, scene[0].get_timecode(), scene[0].frame_num, scene[1].get_timecode(), scene[1].frame_num,))"
                  - button "Copy" [ref=e627] [cursor=pointer]:
                    - img [ref=e628]
                - paragraph [ref=e631]:
                  - text: We can also split the video into each scene if
                  - code [ref=e632]: ffmpeg
                  - text: is installed (
                  - code [ref=e633]: mkvmerge
                  - text: "is also supported):"
                - generic [ref=e634]:
                  - generic [ref=e635]: from scenedetect import detect, ContentDetector, split_video_ffmpeg scene_list = detect('my_video.mp4', ContentDetector()) split_video_ffmpeg('my_video.mp4', scene_list)
                  - button "Copy" [ref=e637] [cursor=pointer]:
                    - img [ref=e638]
                - paragraph [ref=e641]:
                  - text: For more advanced usage, the API is highly configurable, and can easily integrate with any pipeline. This includes using different detection algorithms, splitting the input video, and much more. The following example shows how to implement a function similar to the above, but using
                  - link "the scenedetect API" [ref=e642] [cursor=pointer]:
                    - /url: https://www.scenedetect.com/docs/latest/api.html
                    - text: the
                    - code [ref=e643]: scenedetect
                    - text: API
                  - text: ":"
                - generic [ref=e644]:
                  - generic [ref=e645]: "from scenedetect import open_video, SceneManager, split_video_ffmpeg from scenedetect.detectors import ContentDetector from scenedetect.video_splitter import split_video_ffmpeg def split_video_into_scenes(video_path, threshold=27.0): # Open our video, create a scene manager, and add a detector. video = open_video(video_path) scene_manager = SceneManager() scene_manager.add_detector( ContentDetector(threshold=threshold)) scene_manager.detect_scenes(video, show_progress=True) scene_list = scene_manager.get_scene_list() split_video_ffmpeg(video_path, scene_list, show_progress=True)"
                  - button "Copy" [ref=e647] [cursor=pointer]:
                    - img [ref=e648]
                - paragraph [ref=e651]:
                  - text: See
                  - link "the documentation" [ref=e652] [cursor=pointer]:
                    - /url: https://www.scenedetect.com/docs/latest/api.html
                  - text: for more examples.
