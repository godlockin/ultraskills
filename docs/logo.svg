<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- ultraskills logo: skill grid + arena winner -->
  <defs>
    <linearGradient id="ubg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#3b1d6e"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#ubg)"/>
  <!-- 3x3 skill grid -->
  <g>
    <rect x="76"  y="76"  width="104" height="104" rx="24" fill="#ffffff" opacity="0.16"/>
    <rect x="204" y="76"  width="104" height="104" rx="24" fill="#ffffff" opacity="0.30"/>
    <rect x="332" y="76"  width="104" height="104" rx="24" fill="#ffffff" opacity="0.16"/>
    <rect x="76"  y="204" width="104" height="104" rx="24" fill="#ffffff" opacity="0.30"/>
    <!-- arena winner tile -->
    <rect x="204" y="204" width="104" height="104" rx="24" fill="url(#gold)"/>
    <path d="M256 224l11.8 24.2 26.7 3.8-19.3 18.7 4.6 26.6L256 285l-23.8 12.5 4.6-26.6-19.3-18.7 26.7-3.8z" fill="#1e1b4b"/>
    <rect x="332" y="204" width="104" height="104" rx="24" fill="#ffffff" opacity="0.30"/>
    <rect x="76"  y="332" width="104" height="104" rx="24" fill="#ffffff" opacity="0.30"/>
    <rect x="204" y="332" width="104" height="104" rx="24" fill="#ffffff" opacity="0.16"/>
    <rect x="332" y="332" width="104" height="104" rx="24" fill="#ffffff" opacity="0.16"/>
  </g>
  <!-- lightning bolt on winner tile -->
  <path d="M270 218l-38 54h24l-12 40 44-58h-26z" fill="#FDE68A" opacity="0"/>
</svg>
