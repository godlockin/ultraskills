cluster: cluster-001-cro
name: "CRO Skills Benchmark"
version: 1.0.0
description: "Comprehensive test suite for Conversion Rate Optimization skills"

test_cases:
  - id: tc-001
    name: "Landing Page Conversion Analysis"
    description: "Analyze a landing page and provide actionable CRO recommendations"
    input:
      type: url
      value: "https://www.example-saas.com/landing"
    context:
      traffic_source: "Google Ads"
      primary_goal: "Free trial signup"
      current_conversion_rate: "2.5%"
    expected_outputs:
      - "Identify at least 3 conversion barriers"
      - "Provide specific, actionable recommendations"
      - "Prioritize by estimated impact (high/medium/low)"
      - "Include rationale for each recommendation"
    scoring:
      speed:
        weight: 0.3
        max_points: 30
        thresholds:
          - "response < 5s: 30 points"
          - "5s <= response < 10s: 20 points"
          - "response >= 10s: 10 points"
      quality:
        weight: 0.5
        max_points: 50
        criteria:
          - name: "accuracy"
            description: "Issues identified are real problems"
            points: 15
          - name: "actionability"
            description: "Recommendations can be implemented"
            points: 20
          - name: "completeness"
            description: "Covers all major conversion factors"
            points: 15
      maintainability:
        weight: 0.2
        max_points: 20
        criteria:
          - name: "structure"
            description: "Output is well-organized"
            points: 10
          - name: "clarity"
            description: "Easy to understand and share"
            points: 10

  - id: tc-002
    name: "A/B Test Design"
    description: "Design an A/B test for a given conversion problem"
    input:
      type: scenario
      value: |
        Problem: Users drop off at the pricing page.
        Current pricing: $49/mo single tier.
        Goal: Increase conversion to paid.
    expected_outputs:
      - "Clear hypothesis statement"
      - "Test variant description"
      - "Primary and secondary metrics"
      - "Sample size calculation"
      - "Test duration recommendation"
    scoring:
      speed:
        weight: 0.3
        max_points: 30
      quality:
        weight: 0.5
        max_points: 50
        criteria:
          - name: "hypothesis_quality"
            points: 10
          - name: "metric_selection"
            points: 15
          - name: "statistical_rigor"
            points: 15
          - name: "feasibility"
            points: 10
      maintainability:
        weight: 0.2
        max_points: 20

  - id: tc-003
    name: "Signup Flow Optimization"
    description: "Analyze and optimize a signup flow"
    input:
      type: flow_description
      value: |
        Current flow:
        1. Email input
        2. Password creation (8+ chars, 1 number, 1 special char)
        3. Name and company
        4. Email verification
        5. Credit card entry
        6. Welcome survey (5 questions)
      drop_off_rate: "65% overall, 40% at credit card step"
    expected_outputs:
      - "Identify friction points"
      - "Suggest specific field/form improvements"
      - "Recommend flow changes with expected impact"
    scoring:
      speed: { weight: 0.3, max_points: 30 }
      quality: { weight: 0.5, max_points: 50 }
      maintainability: { weight: 0.2, max_points: 20 }

  - id: tc-004
    name: "Popup/Modal Optimization"
    description: "Design an exit-intensity popup strategy"
    input:
      type: scenario
      value: |
        Context: E-commerce site with $150 AOV
        Exit rate: 72% on product pages
        Goal: Capture emails without hurting UX
    expected_outputs:
      - "Popup copy and design recommendations"
      - "Trigger timing and conditions"
      - "Offer/incentive suggestions"
      - "A/B test ideas for popup variants"
    scoring:
      speed: { weight: 0.3, max_points: 30 }
      quality: { weight: 0.5, max_points: 50 }
      maintainability: { weight: 0.2, max_points: 20 }

  - id: tc-005
    name: "Copy Critique and Rewrite"
    description: "Critique existing page copy and provide improved version"
    input:
      type: copy_sample
      value: |
        Hero Section:
        Headline: "Enterprise-Grade Solutions for Modern Businesses"
        Subhead: "Leverage our cutting-edge platform to unlock synergies
        and drive growth through innovative methodologies."
        CTA: "Get Started"
    expected_outputs:
      - "Specific critique of current copy"
      - "Rewritten version with improvements"
      - "Explanation of changes and rationale"
      - "Alternative versions for A/B testing"
    scoring:
      speed: { weight: 0.3, max_points: 30 }
      quality: { weight: 0.5, max_points: 50 }
      maintainability: { weight: 0.2, max_points: 20 }

---

# Execution Guidelines

## Parallel Execution
- Run all skills against the same test cases simultaneously
- Use separate API keys/sessions to avoid contamination
- Record exact timing and token usage

## Scoring Process
1. **Automated scoring**: Apply rubric rules programmatically where possible
2. **LLM evaluation**: Use independent LLM judge for qualitative assessment
3. **Human review**: Optional spot-check for borderline cases

## Winner Determination
- Highest total score wins
- Tiebreaker: Quality score > Speed score > Maintainability score
- New challenger must beat winner by at least 2 points to avoid fluke
