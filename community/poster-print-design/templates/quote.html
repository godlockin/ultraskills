<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { box-sizing:border-box; margin:0; padding:0; }
html,body { width:1080px; height:1080px; }
body {
  font-family:-apple-system,"SF Pro Display","PingFang SC",sans-serif;
  background:#fefce8; color:#1e293b;
  padding:120px; display:flex; flex-direction:column; justify-content:center;
}
.mark { font-size:160px; line-height:1; color:#f59e0b; opacity:0.5; }
.quote { font-size:48px; line-height:1.4; font-weight:600; margin-top:-40px; }
.author { font-size:24px; opacity:0.7; margin-top:48px; }
.author::before { content:"— "; }
</style></head>
<body>
  <div class="mark">"</div>
  <div class="quote">{{QUOTE}}</div>
  <div class="author">{{AUTHOR}}</div>
</body></html>
