<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { box-sizing: border-box; margin:0; padding:0; }
html, body { width:1200px; height:630px; }
body {
  font-family: -apple-system, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
  color: white; padding: 80px 96px; display: flex; flex-direction: column; justify-content: space-between;
}
.glow { position:absolute; width:600px; height:600px; border-radius:50%;
  background: radial-gradient(circle, rgba(56,189,248,0.35) 0%, transparent 70%);
  top:-200px; right:-200px; }
.title { font-size: 72px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em; max-width: 900px; }
.subtitle { font-size: 28px; opacity: 0.75; margin-top: 24px; max-width: 900px; }
.author { font-size: 22px; opacity: 0.6; }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#38bdf8; margin-right:12px; vertical-align:middle; }
</style></head>
<body>
  <div class="glow"></div>
  <div>
    <div class="title">{{TITLE}}</div>
    <div class="subtitle">{{SUBTITLE}}</div>
  </div>
  <div class="author"><span class="dot"></span>{{AUTHOR}}</div>
</body></html>
