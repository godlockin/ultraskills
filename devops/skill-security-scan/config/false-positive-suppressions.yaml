# SkillSpector False-Positive Suppressions
# Last audited: 2026-06-16
# Audit method: 78 "Hidden Instructions" findings reviewed against source
# Result: 0 malicious, 78 false positives (HTML/XML comments matched as "instructions")

# Format:
#   - pattern: <substring or glob>
#     reason: <why it's a false positive>
#     examples:
#       - <file path>

suppressions:

  - pattern: "<!-- "
    category: html_comment
    reason: >
      HTML comments like `<!-- AUTO-GENERATED -->`, `<!-- Connection status banner -->`,
      `<!-- Bold -->` are commonly found in HTML/XML docs and templates. The scanner's
      YARA "hidden instruction" rule fires on any `<!-- ` block.
    affects_count: ~50
    examples:
      - community/gstack/autoplan/SKILL.md:26
      - community/gstack/design-html/SKILL.md:25
      - community/gstack/extension/sidepanel.html:8
      - community/docx/ooxml.md:49
      - community/pptx/ooxml.md:19
      - community/magazine-web-ppt/references/components.md:28
      - community/planning-with-files/templates/findings.md:2,9,20
      - community/planning-with-files/templates/task_plan.md:2,9
      - (and 26 planning-with-files platform variants)

  - pattern: "browse/test/fixtures/"
    category: test_fixture
    reason: >
      The browse test fixtures are *intentionally malicious* — they're used to test
      the gstack browser's prompt-injection detection. Files like
      `injection-combined.html`, `injection-hidden.html`, `media-page.html` are
      expected to contain "injection" content; that's the test corpus.
    affects_count: 5
    examples:
      - community/gstack/browse/test/fixtures/injection-combined.html:20,35
      - community/gstack/browse/test/fixtures/injection-hidden.html:23
      - community/gstack/browse/test/fixtures/media-page.html:38
      - community/gstack/browse/test/fixtures/qa-eval.html:21
      - community/gstack/test/fixtures/review-eval-design-slop.html:10

  - pattern: "*.xsd"
    category: xml_schema
    reason: >
      XSD files start with `<?xml version="1.0"?>` comments, which the scanner
      matches. These are standard ECMA OOXML schemas from the docx/pptx tooling
      bundles, not custom code.
    affects_count: 6
    examples:
      - community/docx/ooxml/schemas/ecma/fouth-edition/opc-contentTypes.xsd
      - community/docx/ooxml/schemas/ecma/fouth-edition/opc-coreProperties.xsd
      - community/docx/ooxml/schemas/ecma/fouth-edition/opc-relationships.xsd
      - (and 3 matching pptx/ooxml/schemas/*.xsd files)

  - pattern: "review-eval-design-slop.html"
    category: test_fixture
    reason: >
      Eval fixture for slop detection — name says it. Test data only.
    affects_count: 1
    examples:
      - community/gstack/test/fixtures/review-eval-design-slop.html:10

# Recommendations:
# 1. Submit upstream patches to NVIDIA/SkillSpector to add YARA exception
#    for `<!-- ` followed by HTML/XML structure keywords (Banner, Bold, etc.)
# 2. Configure scanner to skip `*/test/fixtures/*` paths in CI runs
# 3. Configure scanner to skip `*.xsd` files
# 4. The 78 current findings are all noise — none represent real hidden instructions
