# ultraskills-hub · Skill 别名与触发词覆盖表
#
# 目的:
#   为外部 skill 或英文 description 的 skill 提供本地中文/口语化触发词,
#   让 hub 搜索能命中,而不需要 fork 或修改上游。
#
# 生效机制:
#   arena_build_index.py 读取本文件,将 aliases 合并到目标 skill 的 recommended_for 字段。
#   search.py 已经会对 recommended_for 加 +5 分/命中(见 search.py line 168)。
#
# 规则:
#   - 顶层 key = skill_id
#   - 每个 skill 下 aliases 字段是字符串数组
#   - 只加"用户可能用来搜索但 description 里没有"的表达
#   - 精确、口语化、场景化 > 学术化
#   - 每个 skill 15-40 条触发词即可,过多反而稀释权重

